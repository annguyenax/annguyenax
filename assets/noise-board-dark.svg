<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d">
  <title id="t">Nguyen Van An - Noise Board: lab evidence, not production</title>
  <desc id="d">TON_IoT autoencoder detection vs false positive by layer (README table, recomputed mean). Suricata lab alert counts 54 baseline vs 486 with 88 custom rules, 16 of 88 rules fired. SRE lab: 4-step RCA, collector stopped then local logs backfilled on restart. Personal labs, not a production SOC.</desc>
  <rect width="880" height="560" fill="#07110f"/>
  <g fill="#eef5ec" font-family="ui-monospace, 'DM Mono', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="34" font-size="13" fill="#c8ff4d" letter-spacing="1">NGUYEN VAN AN - NOISE BOARD</text>
    <text x="856" y="34" font-size="10.5" fill="#94a69e" text-anchor="end">lab evidence, not production SOC</text>
  </g>
  <line x1="24" y1="48" x2="856" y2="48" stroke="#eef5ec" stroke-opacity=".16"/>

  <!-- Panel A: TON_IoT detection vs FP -->
  <text x="24" y="76" font-size="11" letter-spacing=".08em" fill="#94a69e" font-family="ui-monospace, monospace">TON_IOT AUTOENCODER - DETECTION VS FALSE POSITIVE</text>
  <text x="24" y="94" font-size="10" fill="#94a69e" font-family="ui-monospace, monospace">src: ton-iot-zero-day-ids/README.md (recomputed mean, 2026-10)</text>
  <g stroke="#294237" fill="none">
    <path d="M56 112 V276 H736"/>
    <path d="M56 136 H736 M56 206 H736" opacity=".7"/>
  </g>
  <g fill="#94a69e" font-family="ui-monospace, monospace" font-size="10.5">
    <text x="48" y="116" text-anchor="end">100%</text>
    <text x="48" y="210" text-anchor="end">50%</text>
  </g>
  <!-- baseline y=276, 140px = 100% -->
  <g>
    <rect fill="#c8ff4d" x="90" y="136.3" width="26" height="139.7"/>
    <rect fill="#ff795c" x="122" y="245.2" width="26" height="30.8"/>
    <rect fill="#c8ff4d" x="250" y="136.7" width="26" height="139.3"/>
    <rect fill="#ff795c" x="282" y="248" width="26" height="28"/>
    <rect fill="#c8ff4d" x="410" y="161.2" width="26" height="114.8"/>
    <rect fill="#ff795c" x="442" y="250.8" width="26" height="25.2"/>
    <rect fill="#c8ff4d" x="570" y="138.8" width="26" height="137.2"/>
    <rect fill="#ff795c" x="602" y="270.4" width="26" height="5.6"/>
  </g>
  <path d="M56 253.3 H736" stroke="#ff795c" stroke-dasharray="4 3" fill="none"/>
  <g fill="#eef5ec" font-family="ui-monospace, monospace" font-size="11">
    <text x="119" y="296" text-anchor="middle">Network</text>
    <text x="119" y="312" text-anchor="middle" fill="#94a69e" font-size="10">FP 22% . 328x sep</text>
    <text x="279" y="296" text-anchor="middle">IoT Modbus</text>
    <text x="279" y="312" text-anchor="middle" fill="#94a69e" font-size="10">FP 20% . 33x sep</text>
    <text x="439" y="296" text-anchor="middle">Linux</text>
    <text x="439" y="312" text-anchor="middle" fill="#94a69e" font-size="10">FP 18% . 8x sep</text>
    <text x="599" y="296" text-anchor="middle">Windows</text>
    <text x="599" y="312" text-anchor="middle" fill="#94a69e" font-size="10">FP 4% . 36x sep</text>
    <text x="730" y="249" text-anchor="end" fill="#ff795c" font-size="10.5">mean FP 16.0%</text>
  </g>
  <text x="24" y="336" fill="#94a69e" font-family="ui-monospace, monospace" font-size="10.5">mean: detection 94.8% . FP 16.0% . accuracy 88.4% (recomputed from the table; README's old average row did not match it)</text>

  <line x1="24" y1="352" x2="856" y2="352" stroke="#eef5ec" stroke-opacity=".16"/>

  <!-- Panel B: Suricata alert delta -->
  <text x="24" y="376" font-size="11" letter-spacing=".08em" fill="#94a69e" font-family="ui-monospace, monospace">SURICATA LAB - ALERT COUNT IS NOT A QUALITY SCORE</text>
  <text x="24" y="394" font-size="10" fill="#94a69e" font-family="ui-monospace, monospace">src: suricata-ids-custom-rules/results/REAL_COMPARISON_REPORT.txt</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#eef5ec">
    <text x="24" y="420">54 alerts, default rules (~30,000)</text>
    <rect x="300" y="408" width="28" height="14" fill="#c8ff4d"/>
    <text x="24" y="448">486 alerts, +88 custom rules (~47,324 total)</text>
    <rect x="300" y="436" width="252" height="14" fill="#c8ff4d"/>
    <text x="566" y="420" fill="#94a69e" font-size="10">9x more alerts</text>
    <text x="566" y="448" fill="#ff795c" font-size="10">only 16/88 custom rules fired</text>
  </g>
  <text x="24" y="472" fill="#94a69e" font-family="ui-monospace, monospace" font-size="10">benign traffic still produced 32 alerts (20 from one rule, SID 1000017) - requires PCAP/log triage, not auto-block</text>

  <line x1="24" y1="488" x2="856" y2="488" stroke="#eef5ec" stroke-opacity=".16"/>

  <!-- Panel C: SRE RCA steps -->
  <text x="24" y="512" font-size="11" letter-spacing=".08em" fill="#94a69e" font-family="ui-monospace, monospace">SRE LAB - REPLAY OF A DOCUMENTED INCIDENT (COLLECTOR OUTAGE)</text>
  <g fill="#c8ff4d">
    <circle cx="48" cy="534" r="4"/><circle cx="268" cy="534" r="4"/>
    <circle cx="488" cy="534" r="4"/><circle cx="708" cy="534" r="4"/>
  </g>
  <line x1="48" y1="534" x2="708" y2="534" stroke="#294237" stroke-width="2"/>
  <g fill="#eef5ec" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">
    <text x="48" y="552" text-anchor="start">01 stop collector</text>
    <text x="268" y="552">02 log kept locally</text>
    <text x="488" y="552">03 restart</text>
    <text x="708" y="552" text-anchor="end">04 backfilled, matched</text>
  </g>
</svg>
